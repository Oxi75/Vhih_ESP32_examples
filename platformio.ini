; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;note: This configuration file is using older versions of the libraries
;the ESPAsyncWebServer, AsyncTCP and ArduinoJson libraries that are compatible
;to ensure maximum stability and compatibility with the original homee-api-esp32 library.
;you can also use https://github.com/DanielKnoop/homee-api-esp32@0.2.7 for the
;latest original version of the vhih library.

[env:esp32dev]
platform = espressif32@5.1.1
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ 6.17.3
    https://github.com/dvarrel/AsyncTCP@1.1.4
    https://github.com/DanielKnoop/ESPAsyncWebServer@1.2.7    
    ;https://github.com/DanielKnoop/homee-api-esp32@0.2.7
    https://github.com/Oxi75/homee-api-esp32#feature/stabilityImprovements
